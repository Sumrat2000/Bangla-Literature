name: Build APK

# Release APKs need gen_snapshot for a linux-arm64 host, which Google does
# not ship — so on-device (Termux/phone) `flutter build apk --release`
# cannot work. This workflow builds the real release APK on a normal x64
# GitHub-hosted runner instead. Trigger it manually from the Actions tab,
# or just push to main.
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
