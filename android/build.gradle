allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Redirect all subproject build directories under a shared top-level
// "build" folder, matching the default Flutter template layout. This
// keeps output paths short, which matters on Termux/Android filesystems.
rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
