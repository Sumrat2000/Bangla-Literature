# JVM heap for the Gradle daemon. Termux/on-device builds are RAM-constrained,
# so this is kept modest (~2GB heap / 1GB metaspace). Raise -Xmx if your
# device has more free RAM and builds are slow; lower it if you see the
# Gradle daemon get OOM-killed.
org.gradle.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=1024M -XX:+HeapDumpOnOutOfMemoryError

android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false

# This project intentionally stays on Android Gradle Plugin 8.x (see
# android/settings.gradle) rather than jumping to AGP 9's new build-file DSL.
# Recent Flutter/AGP tooling prints an informational warning about the
# upcoming AGP 9 / android.newDsl migration even on 8.x projects; setting
# this explicitly makes the choice intentional rather than accidental, and
# keeps the classic Kotlin Gradle Plugin application (used below) working.
android.newDsl=false

# Building one module at a time keeps peak memory lower on constrained
# devices. Remove this line (or set to true) once you're building on a
# machine with more RAM to speed things up.
org.gradle.parallel=false
org.gradle.caching=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
