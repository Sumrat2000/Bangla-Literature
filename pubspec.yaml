name: bangla_sahitya_app
description: "বাংলা সাহিত্য — Interactive Learning & Revision Platform"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # --- State management ---
  flutter_riverpod: ^2.5.1

  # --- Local database (offline-first) ---
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # --- Navigation ---
  go_router: ^14.2.0

  # --- UI helpers ---
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # --- Codegen ---
  build_runner: ^2.4.11
  drift_dev: ^2.16.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/
